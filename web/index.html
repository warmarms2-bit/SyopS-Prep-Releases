<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyopS Prep</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      SyopS <b>PREP</b>
    </div>
    <nav id="nav">
      <button class="nav-item" data-page="inicio">🏠 Inicio</button>
      <button class="nav-item" data-page="diagnostico">🖥 Diagnóstico</button>
      <button class="nav-item" data-page="categoria">🗂 Categoría</button>
      <button class="nav-item" data-page="seleccion">✅ Selección</button>
      <button class="nav-item" data-page="resumen">📋 Resumen</button>
      <button class="nav-item" data-page="descarga">⬇️ Descarga</button>
      <button class="nav-item" data-page="final">🏁 Final</button>
    </nav>
    <div class="sidebar-foot">
      <img src="/static/img/maguito.png" alt="maguito" class="mascot">
      <div class="status" id="status">Listo</div>
    </div>
  </aside>

  <main class="workspace">
    <div class="content">
      <header class="topbar">
        <h1 id="page-title">Inicio</h1>
        <button id="btn-start" class="btn primary">▶ Empezar</button>
        <button id="btn-restart" class="btn accent" hidden>↺ Reiniciar</button>
      </header>

      <!-- Terminal del wizard en el navegador -->
      <section class="terminal" id="terminal">
        <div class="term-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">syops — terminal</span></div>
        <pre id="output" class="term-output">Bienvenido. El wizard de SyopS corre en el navegador, con la misma lógica de la terminal.
Presioná ▶ Empezar para arrancar el flujo.</pre>
      </section>

      <footer class="inputbar" id="inputbar" hidden>
        <span class="prompt-char">»</span>
        <input id="input" type="text" autocomplete="off" placeholder="Escribí acá y presioná Enter…">
        <button id="btn-send" class="btn">Enviar</button>
      </footer>
    </div>

    <!-- Leyenda de instrucciones (se actualiza según la etapa) -->
    <aside class="help" id="help">
      <div class="help-title">🛈 Ayuda</div>
      <div class="help-step" id="help-step">Paso 1/7</div>
      <p class="help-text" id="help-text"></p>
    </aside>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
