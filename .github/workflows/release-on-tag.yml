name: Release on tag
# Publica una GitHub Release (instalador .dmg + portable Windows .exe) al
# pushear un tag vX.Y.Z.
#
# Desde 1.3.91 el repo público es SOLO distribución de binarios (no contiene
# código fuente). Los binarios ya están en dist/ del repo público (los copia
# el release pipeline desde el dev, y el .exe se genera en el dev/build).
# Este workflow solo arma la Release con esos binarios ya presentes.
#
# El tag lo crea make_release.sh (release de un paso) al publicar una versión.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar binarios como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Binarios disponibles en dist/:"
          ls -la dist/ dist/portable/ || true
          # Si ya existe un release/tag con esa versión, lo re-crea (para re-publicar)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          # Solo instalador (.dmg) + portable Windows (.exe)
          gh release create "$TAG" \
            dist/portable/SyopS_Prep.dmg \
            dist/portable/syops-portable.exe \
            --title "SyopS Prep v$VERSION" \
            --notes "SyopS Prep v$VERSION"
