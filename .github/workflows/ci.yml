name: CI (bundle público)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cloudscraper
      - name: Compila (sintaxis de todo el bundle)
        run: python -m compileall -q .
      - name: Smoke import (el bundle debe importar sin resolver_pack)
        run: python -c "import syops_wizard; import app_config; print('import OK')"
        env:
          SYOPS_NO_CATALOG_FETCH: "1"
      - name: Scan rutas del dev / secretos
        run: |
          ! grep -rInE "sk-[A-Za-z0-9]{20,}|/Users/eze" . --include=*.py --include=*.sh --exclude-dir=.git || exit 1
